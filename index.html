<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>make urself at home!!</title>
  <link rel="icon" type="image/jpeg" href="https://nicegirlslumber.neocities.org/newfavicon.png" alt="myface">
  <style>
    html {
      font-size: 95%;
      height: 100%;
      margin: 0; 
    }
    * {
      margin: 0;
      padding: 0;
      cursor: auto;
    }
    body { 
      background-image: url(https://file.garden/aXAN9qfqA36RH-Az/Concept%20website%200.3/realbedroomgurl.png);
      background-position: center; 
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: cover;
      height: 100vh;
      overflow: hidden;
    }

    /* Arrow Styles */
    .Arrow1 { position: absolute; top: 26vw; left: 43vw; height: 90px; width: 90px; }
    .Arrow2 { position: absolute; bottom: 4vw; right: 21vw; height: 90px; width: 90px; }
    .Arrow3 { position: absolute; top: 10vw; left: 70vw; height: 80px; width: 80px; }
    .Arrow4 { position: absolute; bottom: 13vw; right: 6vw; height: 70px; width: 70px; }
    .Arrow5 { position: absolute; top: 5vw; left: 41vw; height: 80px; width: 80px; }
    .Arrow6 { position: absolute; top: 5vw; left: 58vw; height: 75px; width: 78px; }

    /* Modal Backdrop / Dim overlay */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.6s ease, visibility 0.6s ease;
      z-index: 1000;
    }

    .overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    /* Envelope Wrapper Container */
    .envelope-wrapper {
      position: relative;
      width: 300px;
      height: 200px;
      background-color: #f2acbf;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      margin-top: 50px;
    }

    /* Top flap of envelope */
    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 150px solid transparent;
      border-right: 150px solid transparent;
      border-top: 110px solid #e293a8;
      transform-origin: top;
      transition: transform 0.5s ease 0.2s;
      z-index: 3;
    }

    /* Open flap rotation state */
    .envelope-wrapper.open .envelope-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    /* Envelope pocket front */
    .envelope-front {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 150px solid #f6b8c9;
      border-right: 150px solid #f6b8c9;
      border-top: 100px solid transparent;
      border-bottom: 100px solid #f6b8c9;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
      z-index: 3;
    }

    /* The Invitation Letter Inside */
    .letter {
      position: absolute;
      bottom: 10px;
      left: 15px;
      width: 270px;
      background: #ffffff;
      border-radius: 12px;
      padding: 20px 15px;
      box-sizing: border-box;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      z-index: 2;
      transition: transform 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.6s;
    }

    /* Slide Up Letter Animation */
    .envelope-wrapper.open .letter {
      transform: translateY(-130px);
    }

    /* Confirmation Button */
    .confirm-btn {
      margin-top: 15px;
      padding: 8px 20px;
      background-color: #ff85a2;
      color: white;
      border: none;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .confirm-btn:hover {
      background-color: #ff6088;
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div class="overlay" id="modalOverlay">
    <div class="envelope-wrapper" id="envelope">
      <div class="envelope-flap"></div>
      
      <div class="letter">
        <h2 style="color: #ff6088; font-size: 1.3rem;">💌 You're Invited!</h2>
        <p style="margin-top: 8px; color: #666; font-size: 0.9rem;">Welcome to my bedroom site! Make yourself at home.</p>
        <button class="confirm-btn" onclick="closeInvitation()">Come On In!</button>
      </div>

      <div class="envelope-front"></div>
    </div>
  </div>

  <main class="container">
    <audio id="audio" src="https://file.garden/aXAN9qfqA36RH-Az/Concept%20website%200.3/benkirb-shine-11-268907%20(1).mp3"></audio>

    <a href="https://nicegirlslumber.neocities.org/Diary">
      <img src="https://nicegirlslumber.neocities.org/Arrow5.png" onmouseover="playAudio()" alt="diary entrance" class="Arrow1">
    </a>
    <a href="https://nicegirlslumber.neocities.org/Guestbook">
      <img src="https://nicegirlslumber.neocities.org/Arrow2.png" onmouseover="playAudio()" alt="guestbook" class="Arrow2">
    </a> 
    <a href="https://nicegirlslumber.neocities.org/Gallery">
      <img src="https://nicegirlslumber.neocities.org/Arrow9.png" onmouseover="playAudio()" alt="gallery entrance" class="Arrow3">
    </a> 
    <a href="https://nicegirlslumber.neocities.org/Shrines">
      <img src="https://nicegirlslumber.neocities.org/Arrow3.png" onmouseover="playAudio()" alt="Shrines" class="Arrow4">
    </a>
    <a href="https://nicegirlslumber.neocities.org/Dressup">
      <img src="https://nicegirlslumber.neocities.org/Arrow10.png" onmouseover="playAudio()" alt="Dressup" class="Arrow5">
    </a>
    <a href="https://nicegirlslumber.neocities.org/Balcony">
      <img src="https://nicegirlslumber.neocities.org/Arrow8.png" onmouseover="playAudio()" alt="lets listen to music" class="Arrow6">
    </a>
  </main>

  <script>
    // Trigger envelope open sequence when page loads
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        document.getElementById('envelope').classList.add('open');
      }, 300);
    });

    function closeInvitation() {
      // Fade out and hide the overlay backdrop and envelope
      document.getElementById('modalOverlay').classList.add('hidden');
    }

    function playAudio() {
      const audio = document.getElementById('audio');
      audio.currentTime = 0;
      audio.play().catch(() => {});
    }
  </script>

</body>
</html>
